[project]
name = "automated-actions-utils"
version = "0.1.0"
description = "Automated Actions Utils"
authors = [{ name = "AppSRE", email = "sd-app-sre@redhat.com" }]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = "~= 3.14.0"
dependencies = [
    "boto3==1.43.71",
    "gql==4.0.0",
    "hvac==2.4.0",
    "kubernetes==36.0.3",
    "openshift==0.13.2",
    "pydantic==2.13.4",
    "sretoolbox==4.0.1",
    "types-boto3-lite[rds]==1.43.71",
    "types-hvac==2.4.0.20260731",
]

[project.urls]
homepage = "https://github.com/app-sre/automated-actions"
repository = "https://github.com/app-sre/automated-actions"
documentation = "https://github.com/app-sre/automated-actions"

[dependency-groups]
dev = [
    # Development dependencies
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest==9.1.1",
    "qenerate==0.10.0",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["automated_actions_utils"]

[tool.hatch.build.targets.wheel]
only-include = ["automated_actions_utils"]

# Ruff configuration
[tool.ruff]
line-length = 88
src = ["automated_actions_utils"]
extend-exclude = [
    # exclude some common cache and tmp directories
    ".local",
    ".cache",
    "tmp",
    "automated_actions_utils/gql_definitions",
]
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",                            # allow typings.Any
    "CPY",                                 # Missing copyright header
    "undocumented-public-module",          # Missing docstring in public module
    "undocumented-public-class",           # Missing docstring in public class
    "undocumented-public-method",          # Missing docstring in public method
    "undocumented-public-function",        # Missing docstring in public function
    "undocumented-public-package",         # Missing docstring in public package
    "undocumented-magic-method",           # Missing docstring in magic method
    "undocumented-public-nested-class",    # Missing docstring in nested public class
    "undocumented-public-init",            # Missing docstring in __init__
    "incorrect-blank-line-before-class",   # 1 blank line required before class docstring
    "blank-line-before-class",             # No blank lines allowed before class docstring
    "multi-line-summary-first-line",       # multi-line-summary-first-line
    "multi-line-summary-second-line",      # multi-line-summary-second-line
    "D4",                                  # Doc string style
    "line-too-long",                       # Line too long
    "line-contains-todo",                  # TODO comment found
    "logging-f-string",                    # Logging statement uses f-string
    "too-many-public-methods",             # Too many public methods
    "too-many-arguments",                  # Too many arguments
    "too-many-positional-arguments",       # Too many positional arguments
    "assert",                              # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",        # subprocess import
    "raw-string-in-exception",             # Exception must not use a string literal, assign to variable first
    "f-string-in-exception",               # Exception must not use an f-string literal, assign to variable first
    "raise-vanilla-args",                  # Avoid specifying long messages outside the exception class
    "try-consider-else",                   # try-consider-else
    "typing-only-third-party-import",      # type-checking-block
    "typing-only-standard-library-import", # type-checking-block
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
]
[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["automated_actions_utils"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
]

# Mypy configuration
[tool.mypy]
files = ["automated_actions_utils"]
enable_error_code = ["truthy-bool", "redundant-expr"]
plugins = ["pydantic.mypy"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Below are all of the packages that don't implement stub packages. Mypy will throw an error if we don't ignore the
# missing imports. See: https://mypy.readthedocs.io/en/stable/running_mypy.html#missing-imports
module = ["kubernetes.*", "openshift.dynamic.*", "sretoolbox.*"]
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

# [tool.coverage.report]
# fail_under = 90
