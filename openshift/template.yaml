---
apiVersion: template.openshift.io/v1
kind: Template
labels:
  template: automated-actions
metadata:
  name: automated-actions
  annotations:
    description: automated-actions
objects:
# -------- CONFIG MAP ----------
- apiVersion: v1
  kind: ConfigMap
  metadata:
    annotations:
      qontract.recycle: "true"
    labels:
      app.kubernetes.io/name: automated-actions
    name: automated-actions-config
  data:
    AA_SESSION_TIMEOUT_SECS: "${AA_SESSION_TIMEOUT_SECS}"
    AA_CELERY_OPTS: "${AA_CELERY_OPTS}"
    AA_UVICORN_OPTS: "${AA_UVICORN_OPTS}"
    AA_DEBUG: "${AA_DEBUG}"
    AA_ROOT_PATH: "${AA_ROOT_PATH}"
    AA_URL: "${AA_URL}"
    AA_ENVIRONMENT: "${AA_ENVIRONMENT}"
    AA_VAULT_SERVER_URL: "${AA_VAULT_SERVER_URL}"
    AA_QONTRACT_SERVER_URL: "${AA_QONTRACT_SERVER_URL}"
    OPA_ACTION_API_URL: "http://automated-actions:${AA_APP_PORT}/api/v1"
    OPA_MAX_AGE_MINUTES: "60"

# -------- SECRETS ----------
# One Secret per component so a compromised container only exposes the
# credentials it actually uses (FIND-010). automated-actions-secret (built
# separately by app-interface, see resources/services/automated-actions/
# secrets.yaml.j2) still carries AA_BROKER_URL, which needs the SQS access
# key/secret composed into a URL and can't be expressed as a plain parameter.
- apiVersion: v1
  kind: Secret
  metadata:
    annotations:
      qontract.recycle: "true"
    labels:
      app.kubernetes.io/name: automated-actions
    name: automated-actions-api-secret
  type: Opaque
  stringData:
    AA_OIDC_CLIENT_ID: "${AA_OIDC_CLIENT_ID}"
    AA_OIDC_CLIENT_SECRET: "${AA_OIDC_CLIENT_SECRET}"
    AA_SESSION_SECRET: "${AA_SESSION_SECRET}"
    AA_TOKEN_SECRET: "${AA_TOKEN_SECRET}"
    AA_DYNAMODB_URL: "${AA_DYNAMODB_URL}"
    AA_DYNAMODB_AWS_REGION: "${AA_DYNAMODB_AWS_REGION}"
    AA_DYNAMODB_AWS_ACCESS_KEY_ID: "${AA_DYNAMODB_AWS_ACCESS_KEY_ID}"
    AA_DYNAMODB_AWS_SECRET_ACCESS_KEY: "${AA_DYNAMODB_AWS_SECRET_ACCESS_KEY}"
    AA_SQS_URL: "${AA_SQS_URL}"
    AA_BROKER_AWS_REGION: "${AA_BROKER_AWS_REGION}"
    AA_BROKER_AWS_ACCESS_KEY_ID: "${AA_BROKER_AWS_ACCESS_KEY_ID}"
    AA_BROKER_AWS_SECRET_ACCESS_KEY: "${AA_BROKER_AWS_SECRET_ACCESS_KEY}"

- apiVersion: v1
  kind: Secret
  metadata:
    annotations:
      qontract.recycle: "true"
    labels:
      app.kubernetes.io/name: automated-actions
    name: automated-actions-worker-secret
  type: Opaque
  stringData:
    AA_DYNAMODB_URL: "${AA_DYNAMODB_URL}"
    AA_DYNAMODB_AWS_REGION: "${AA_DYNAMODB_AWS_REGION}"
    AA_DYNAMODB_AWS_ACCESS_KEY_ID: "${AA_DYNAMODB_AWS_ACCESS_KEY_ID}"
    AA_DYNAMODB_AWS_SECRET_ACCESS_KEY: "${AA_DYNAMODB_AWS_SECRET_ACCESS_KEY}"
    AA_SQS_URL: "${AA_SQS_URL}"
    AA_BROKER_AWS_REGION: "${AA_BROKER_AWS_REGION}"
    AA_BROKER_AWS_ACCESS_KEY_ID: "${AA_BROKER_AWS_ACCESS_KEY_ID}"
    AA_BROKER_AWS_SECRET_ACCESS_KEY: "${AA_BROKER_AWS_SECRET_ACCESS_KEY}"
    AA_VAULT_ROLE_ID: "${AA_VAULT_ROLE_ID}"
    AA_VAULT_SECRET_ID: "${AA_VAULT_SECRET_ID}"

- apiVersion: v1
  kind: Secret
  metadata:
    annotations:
      qontract.recycle: "true"
    labels:
      app.kubernetes.io/name: automated-actions
    name: automated-actions-opa-secret
  type: Opaque
  stringData:
    OPA_ACTION_API_TOKEN: "${OPA_ACTION_API_TOKEN}"

# ------- API DEPLOYMENT --------------------
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata:
    name: automated-actions-api
  spec:
    minAvailable: 1
    selector:
      matchLabels:
        app.kubernetes.io/component: api

- apiVersion: v1
  kind: ServiceAccount
  imagePullSecrets: "${{IMAGE_PULL_SECRETS}}"
  metadata:
    name: automated-actions-api
    labels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: automated-actions

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    annotations:
      ignore-check.kube-linter.io/unset-cpu-requirements: "no cpu limits"
    labels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: automated-actions
    name: automated-actions
  spec:
    replicas: ${{AA_API_REPLICAS}}
    selector:
      matchLabels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: automated-actions
    template:
      metadata:
        labels:
          app.kubernetes.io/component: api
          app.kubernetes.io/name: automated-actions
      spec:
        restartPolicy: Always
        serviceAccountName: automated-actions-api
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - api
                topologyKey: topology.kubernetes.io/zone
              weight: 100
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - api
                topologyKey: kubernetes.io/hostname
              weight: 1
        containers:
        - env:
          - name: AA_START_MODE
            value: api
          - name: AA_APP_PORT
            value: "${AA_APP_PORT}"
          envFrom:
          - secretRef:
              name: automated-actions-api-secret
              optional: true
          - secretRef:
              name: automated-actions-secret
              optional: true
          - configMapRef:
              name: automated-actions-config
              optional: true
          image: "${IMAGE}:${IMAGE_TAG}"
          name: web
          ports:
          - containerPort: ${{AA_APP_PORT}}
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - "-c"
                - sleep 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: ${{AA_APP_PORT}}
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: ${{AA_APP_PORT}}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ${{AA_APP_PORT}}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: ${{AA_API_CPU_REQUESTS}}
              memory: ${{AA_API_MEMORY_REQUESTS}}
            limits:
              memory: ${{AA_API_MEMORY_LIMITS}}
        # OPA sidecar: co-located in the api pod and bound to 127.0.0.1 only,
        # so it is reachable exclusively from the web container above and
        # never from another pod, even a co-tenant in the same namespace
        # (OpenShift's default NetworkPolicy only blocks cross-namespace
        # traffic, not same-namespace pod-to-pod traffic). This closes
        # FIND-001 (APPSRE-14970) without needing a NetworkPolicy.
        # httpGet/tcpSocket probes can't reach a loopback-only port from the
        # kubelet, so probes here exec curl from inside the container instead.
        - name: opa
          image: "${OPA_IMAGE}:${IMAGE_TAG}"
          args:
          - run
          - --ignore=.*
          - --server
          - --log-level=info
          - --disable-telemetry
          - --addr=127.0.0.1:${AA_OPA_PORT}
          - --watch
          - /authz # rego policy and default roles
          - /policies # app-interface roles
          envFrom:
          - secretRef:
              name: automated-actions-opa-secret
              optional: true
          - configMapRef:
              name: automated-actions-config
              optional: true
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - "-c"
                - sleep 2
          livenessProbe:
            exec:
              command:
              - curl
              - -sf
              - http://127.0.0.1:${AA_OPA_PORT}/health
            initialDelaySeconds: 5
            periodSeconds: 60
          readinessProbe:
            # Include bundle activation in readiness
            exec:
              command:
              - curl
              - -sf
              - http://127.0.0.1:${AA_OPA_PORT}/health?bundle=true
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            exec:
              command:
              - curl
              - -sf
              - http://127.0.0.1:${AA_OPA_PORT}/health
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: ${{AA_OPA_CPU_REQUESTS}}
              memory: ${{AA_OPA_MEMORY_REQUESTS}}
            limits:
              memory: ${{AA_OPA_MEMORY_LIMITS}}
          volumeMounts:
          - name: policy-volume
            mountPath: /policies
            readOnly: true
        volumes:
        - name: policy-volume
          configMap:
            name: automated-actions-policy

# ---------- API SERVICE -----------
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: automated-actions
    name: automated-actions
  spec:
    ports:
    - name: "http"
      port: ${{AA_APP_PORT}}
      targetPort: ${{AA_APP_PORT}}
    selector:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: automated-actions

# --------- WORKER DEPLOYMENT --------------
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata:
    name: automated-actions-worker
  spec:
    minAvailable: 1
    selector:
      matchLabels:
        app.kubernetes.io/component: worker

- apiVersion: v1
  kind: ServiceAccount
  imagePullSecrets: "${{IMAGE_PULL_SECRETS}}"
  metadata:
    name: automated-actions-worker
    labels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: automated-actions

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    annotations:
      ignore-check.kube-linter.io/unset-cpu-requirements: "no cpu limits"
    labels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: automated-actions
    name: automated-actions-worker
  spec:
    replicas: ${{AA_WORKER_REPLICAS}}
    selector:
      matchLabels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/name: automated-actions
    template:
      metadata:
        labels:
          app.kubernetes.io/component: worker
          app.kubernetes.io/name: automated-actions
      spec:
        restartPolicy: Always
        serviceAccountName: automated-actions-worker
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - worker
                topologyKey: topology.kubernetes.io/zone
              weight: 100
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                    - worker
                topologyKey: kubernetes.io/hostname
              weight: 1
        containers:
        - env:
          - name: AA_START_MODE
            value: worker
          - name: AA_WORKER_METRICS_PORT
            value: "${AA_WORKER_METRICS_PORT}"
          - name: AA_WORKER_TEMP_DIR
            value: /worker-temp-dir
          envFrom:
          - secretRef:
              name: automated-actions-worker-secret
              optional: true
          - secretRef:
              name: automated-actions-secret
              optional: true
          - configMapRef:
              name: automated-actions-config
              optional: true
          image: "${IMAGE}:${IMAGE_TAG}"
          name: worker
          ports:
          - containerPort: ${{AA_WORKER_METRICS_PORT}}
          readinessProbe:
            httpGet:
              path: /metrics
              port: ${{AA_WORKER_METRICS_PORT}}
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: ${{AA_WORKER_METRICS_PORT}}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ${{AA_WORKER_METRICS_PORT}}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: ${{AA_WORKER_CPU_REQUESTS}}
              memory: ${{AA_WORKER_MEMORY_REQUESTS}}
            limits:
              memory: ${{AA_WORKER_MEMORY_LIMITS}}
          volumeMounts:
          - mountPath: /worker-temp-dir
            name: worker-temp-dir
        volumes:
        - name: worker-temp-dir
          emptyDir:
            sizeLimit: 50Mi

# ---------- WORKER SERVICE (PROMETHEUS) -----------
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: automated-actions
    name: automated-actions-worker
  spec:
    ports:
    - name: "http"
      port: ${{AA_WORKER_METRICS_PORT}}
      targetPort: ${{AA_WORKER_METRICS_PORT}}
    selector:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: automated-actions

parameters:
# Global config
- name: IMAGE
  description: Image to use for automated-actions
  value: "quay.io/redhat-services-prod/app-sre-tenant/automated-actions-main/automated-actions-main"
  required: true

- name: OPA_IMAGE
  description: Image to use for OPA
  value: "quay.io/redhat-services-prod/app-sre-tenant/automated-actions-main/opa-main"
  required: true

- name: IMAGE_PULL_SECRETS
  description: Pull secrets to use for automated-actions images
  value: '[]'
  required: false

- name: IMAGE_TAG
  description: automated-actions version
  value: "latest"
  required: true

# Api config
- name: AA_APP_PORT
  description: Port to expose the API app on
  value: "8080"
  required: true

- name: AA_SESSION_TIMEOUT_SECS
  description: Session timeout in seconds
  value: "3600"
  required: true

- name: AA_CELERY_OPTS
  description: Celery options

- name: AA_UVICORN_OPTS
  description: Uvicorn options

- name: AA_DEBUG
  description: Debug mode
  value: "0"
  required: true

- name: AA_ROOT_PATH
  description: Root path for the API

- name: AA_URL
  description: URL of the API
  required: true

- name: AA_ENVIRONMENT
  description: Deployment environment (used e.g. in the DynamoDB table name)
  required: true

- name: AA_VAULT_SERVER_URL
  description: Vault server URL
  value: "https://vault.devshift.net"
  required: true

- name: AA_QONTRACT_SERVER_URL
  description: qontract-server GraphQL URL
  value: "https://app-interface.apps.rosa.appsrep09ue1.03r5.p3.openshiftapps.com/graphql"
  required: true

## Api Pod limits
- name: AA_API_REPLICAS
  description: Web replicas
  value: "3"
  required: true

- name: AA_API_MEMORY_REQUESTS
  description: Web memory requests
  value: "200Mi"
  required: true

- name: AA_API_MEMORY_LIMITS
  description: Web memory limits
  value: "200Mi"
  required: true

- name: AA_API_CPU_REQUESTS
  description: Web cpu requests
  value: "100m"
  required: true

# Worker config
- name: AA_WORKER_METRICS_PORT
  description: Port to expose the web app on
  value: "8000"
  required: true

## Worker Pod limits
- name: AA_WORKER_REPLICAS
  description: Worker replicas
  value: "3"
  required: true

- name: AA_WORKER_MEMORY_REQUESTS
  description: Worker memory requests
  value: "200Mi"
  required: true

- name: AA_WORKER_MEMORY_LIMITS
  description: Worker memory limits
  value: "200Mi"
  required: true

- name: AA_WORKER_CPU_REQUESTS
  description: Worker cpu requests
  value: "100m"
  required: true

# OPA config (sidecar in the api pod, bound to 127.0.0.1 only)
- name: AA_OPA_PORT
  description: Port OPA listens on (loopback-only, no Service)
  value: "8181"
  required: true

## OPA sidecar limits
- name: AA_OPA_MEMORY_REQUESTS
  description: OPA memory requests
  value: "50Mi"
  required: true

- name: AA_OPA_MEMORY_LIMITS
  description: OPA memory limits
  value: "100Mi"
  required: true

- name: AA_OPA_CPU_REQUESTS
  description: OPA cpu requests
  value: "100m"
  required: true

# Secrets, provisioned via app-interface secretParameters - split per component
# so a compromised container only exposes the credentials it uses (FIND-010,
# APPSRE-14977). See the Secret objects above for which component uses which.
- name: AA_OIDC_CLIENT_ID
  description: OIDC client ID
  required: true

- name: AA_OIDC_CLIENT_SECRET
  description: OIDC client secret
  required: true

- name: AA_SESSION_SECRET
  description: Session signing secret
  required: true

- name: AA_TOKEN_SECRET
  description: Bearer token signing secret
  required: true

- name: AA_DYNAMODB_URL
  description: DynamoDB endpoint URL
  required: true

- name: AA_DYNAMODB_AWS_REGION
  description: DynamoDB AWS region
  required: true

- name: AA_DYNAMODB_AWS_ACCESS_KEY_ID
  description: DynamoDB AWS access key ID
  required: true

- name: AA_DYNAMODB_AWS_SECRET_ACCESS_KEY
  description: DynamoDB AWS secret access key
  required: true

- name: AA_SQS_URL
  description: SQS queue URL used as the Celery broker
  required: true

- name: AA_BROKER_AWS_REGION
  description: Celery broker (SQS) AWS region
  required: true

- name: AA_BROKER_AWS_ACCESS_KEY_ID
  description: Celery broker (SQS) AWS access key ID
  required: true

- name: AA_BROKER_AWS_SECRET_ACCESS_KEY
  description: Celery broker (SQS) AWS secret access key
  required: true

- name: AA_VAULT_ROLE_ID
  description: Vault AppRole role ID (worker only)
  required: true

- name: AA_VAULT_SECRET_ID
  description: Vault AppRole secret ID (worker only)
  required: true

- name: OPA_ACTION_API_TOKEN
  description: Bearer token OPA uses to call back into the API for rate limiting (opa sidecar only)
  required: true
